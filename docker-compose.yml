version: "3.8"

services:
  aegis:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegis-security-framework
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./aegis_reports:/app/aegis_reports
    environment:
      - VT_API_KEY=${VT_API_KEY:-}
    stdin_open: true
    tty: true
